<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I__NATIVOS Gerenciador</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/751/751463.png">

    <style>
            textarea {
            width: 100%;
            box-sizing: border-box; /* Isso impede que a caixa vaze para os lados */
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--input-text);
            font-family: inherit;
            margin-bottom: 10px;
            resize: none; /* Impede que o usuário mude o tamanho sem querer */
            transition: all 0.3s ease;
        }
        /* Estilo para as portas vazias (afundadas na CTO) */
        [id^="quad-vis-"] {
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.4);
            background-color: var(--input-bg);
            border: 2px solid var(--border);
            border-radius: 10px;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.3s ease;
        }

        /* Efeito quando a porta é preenchida/colorida (salta para fora) */
        [id^="quad-vis-"][style*="background-color: #"] {
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.2) !important;
            transform: translateY(-3px);
        }


        :root {
            --primary: #2563eb;
            --danger: #dc2626;
            --warning: #f59e0b;
            --dark-bg: #111827; 
            --card-bg: #1f2937;
            --text-main: #f3f4f6;
            --border: #374151;
            --input-bg: #374151;
            --input-text: #ffffff;
            --btn-mini-bg: #4b5563;
            --btn-mini-text: #ffffff;
        }

        body.light-mode {
            --dark-bg: #f0f2f5;      
            --card-bg: #ffffff;      
            --text-main: #1f2937;    
            --border: #d1d5db;       
            --input-bg: #f9fafb;     
            --input-text: #111827;   
            --btn-mini-bg: #e5e7eb;  
            --btn-mini-text: #374151;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--dark-bg);
            margin: 0;
            padding: 10px;
            color: var(--text-main);
            padding-bottom: 80px; 
            transition: background-color 0.3s, color 0.3s;
        }

        .container { max-width: 600px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            background-color: #064e3b;
            color: #4ade80;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 16px;
            border: 1px solid var(--border);
            transition: background-color 0.3s, border-color 0.3s;
        }

        label { display: block; font-weight: 600; margin-bottom: 8px; color: #9ca3af; }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--input-bg);
            color: var(--input-text);
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.7; }
        .btn-blue { background-color: var(--primary); }
        .btn-red { background-color: var(--danger); }

        .port-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .port-label { font-weight: bold; color: var(--primary); width: 40px; }
        .port-input-wrapper { flex: 1; }

        .action-buttons { display: flex; gap: 5px; }

        .mini-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            background: var(--btn-mini-bg);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--btn-mini-text);
            font-size: 1.2rem;
            transition: background-color 0.3s;
        }

        .active-warning { background-color: var(--warning) !important; color: #fff !important; }
        .active-danger { background-color: var(--danger) !important; color: #fff !important; }
        .active-info { background-color: #6b7280 !important; color: #fff !important; }

        .preview-box {
            background-color: #0f172a;
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            color: #60a5fa;
            line-height: 1.4;
        }

        .input-error {
            border-color: var(--danger) !important;
            background-color: rgba(220, 38, 38, 0.15) !important;
            color: var(--danger) !important;
            font-weight: bold;
            animation: shake 0.3s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: var(--danger);
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
                /* Animação para porta inativa (piscar em vermelho e destacar) */
        @keyframes piscar-remocao {
            0% { background-color: #dc2626; transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            50% { background-color: #7f1d1d; transform: scale(1.05); box-shadow: 0 0 15px 5px rgba(220, 38, 38, 0.9); border-color: #fff; }
            100% { background-color: #dc2626; transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

                .status-remover {
            animation: piscar-remocao 1s infinite !important;
            color: white !important;
            font-size: 1.5rem !important;
        }

        /* --- VISUAL DA NOVA JANELA DE AVISOS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(2px);
            display: none; align-items: center; justify-content: center;
            z-index: 2000; opacity: 0; transition: opacity 0.2s;
        }
        .modal-overlay.show { opacity: 1; }
        .modal-box {
            background: var(--card-bg); padding: 20px; border-radius: 12px;
            width: 85%; max-width: 320px; text-align: center;
            border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transform: scale(0.9); transition: transform 0.2s;
        }
        .modal-overlay.show .modal-box { transform: scale(1); }
        .modal-text { margin-bottom: 20px; font-size: 1.05rem; color: var(--text-main); white-space: pre-wrap; font-weight: 500;}
        .modal-buttons { display: flex; gap: 10px; }

    </style>
</head>

<body>

<div class="container">
    <header>
        <div>
            <h1 style="margin:0; font-size:1.4rem; color:var(--primary);">I__NATIVOS</h1>
            <small style="color:#9ca3af;">Controle de CTO / Fibra</small>
        </div>
        <div class="header-controls">

            <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">☀️</button>
            <div class="status-badge" id="onlineStatus">
                <div class="status-dot"></div> On
            </div>
        </div>
    </header>

        <div class="card">
        <label>Identificação da CTO</label>
        
        <!-- Novo formato: Campo de texto e botão de pesquisa lado a lado -->
        <div style="display: flex; gap: 10px;">
            <input type="text" id="ctoName" placeholder="Ex: CTOMO 16.1.6" autocomplete="off" style="flex: 1; margin: 0;">
            <button class="btn btn-blue" onclick="buscarBancoDados()" style="width: 60px; padding: 0; background-color: #059669;" title="Buscar no Excel">
                ☁️🔍
            </button>
        </div>
        
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn btn-blue" style="flex: 2;" onclick="copyToWhatsapp()">📋 Copiar </button>
            <button class="btn btn-red" style="flex: 1;" onclick="clearAll()">🗑️ Limpar</button>
        </div>
    </div>


    <div class="card" id="portsContainer">
    </div>

       <div class="card">
        <label>Visualização Dinâmica da CTO</label>
        
        <div id="cto-visualizer" style="margin-top: 10px;">
            <div id="ctoDrawing" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px;">
                </div>
            
            <div style="display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.8rem; justify-content: center; border-top: 1px solid var(--border); padding-top: 15px; margin-top: 20px;">

                <span><b style="color: #4ade80;">●</b> Livre</span>
                <span><b style="color: #dc2626;">●</b> Defeito</span>
                <span><b style="color: #f59e0b;">●</b> Sem ident.</span>
                <span><b style="color: #2563eb;">●</b> Ocupada</span>
            </div>
        </div>

        <div class="preview-box" id="previewArea" style="display: none;">Aguardando dados...</div>
    </div>
        <div class="card">
        <!-- Botão que abre e fecha a área -->
        <button class="btn" id="btnToggleCentral" onclick="toggleCentral()" style="background-color: var(--btn-mini-bg); color: var(--text-main); border: 1px solid var(--border);">
            ⚙️ Ferramentas da Central (Abrir)
        </button>
        
        <!-- Área oculta com a caixa de texto e os dois botões -->
        <div id="areaCentral" style="display: none; margin-top: 15px;">
            <textarea id="textoRetorno" rows="3" placeholder="Cole aqui a mensagem da Central ou os dados da planilha..."></textarea>
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn btn-red" onclick="analisarRetorno()" style="flex: 1; background-color: #991b1b; font-size: 0.9rem;">
                    🔍 Analisar Inativos
                </button>
                <button class="btn btn-blue" onclick="carregarCTO()" style="flex: 1; font-size: 0.9rem;">
                    ♻️ Carregar CTO
                </button>
            </div>
        </div>
    </div>


</div>

<!-- Nossa Nova Janela de Avisos Profissional -->
<div id="customModal" class="modal-overlay">
    <div class="modal-box">
        <div id="modalText" class="modal-text">Mensagem aqui</div>
        <div class="modal-buttons">
            <button id="modalBtnCancel" class="btn btn-red" style="display: none; flex: 1;">Cancelar</button>
            <button id="modalBtnOk" class="btn btn-blue" style="flex: 1;">OK</button>
        </div>
    </div>
</div>

<div id="toast">⚠️ Código de cliente duplicado!</div>

<script>

    const sfxErro = new Audio('erro_digital.mp3');   
    const sfxClick = new Audio('click_tec.mp3');     
    const sfxSucesso = new Audio('sucesso.mp3');     
    const sfxLixo = new Audio('trash.mp3');          

    sfxErro.volume = 0.5;
    sfxClick.volume = 0.3;
    
    function showToast(show) {
        const toast = document.getElementById("toast");
        if (show) {
            toast.className = "show";
            if (navigator.vibrate) navigator.vibrate(200); 
            sfxErro.currentTime = 0; 
            sfxErro.play().catch(e => console.log("Erro ao tocar som:", e)); 
        } else {
            toast.className = toast.className.replace("show", "");
        }
    }

    function setQuickAction(index, text) {
        sfxClick.currentTime = 0; 
        sfxClick.play().catch(e => {});          
        const input = document.getElementById(`input-${index}`);
        input.value = text;
        updateData(index, text);
    }

                function copyToWhatsapp() {
        const text = document.getElementById('previewArea').textContent;
        const currentCtoName = document.getElementById('ctoName').value.trim() || 'CTO SEM NOME';
        const currentPortsJSON = JSON.stringify(portsData); 
        
        // Colocamos o "async" aqui dentro para poder esperar a resposta do usuário
        navigator.clipboard.writeText(text).then(async () => {
            if (typeof sfxSucesso !== 'undefined') {
                sfxSucesso.currentTime = 0;
                sfxSucesso.play().catch(e => {}); 
            }
            const btn = document.querySelector('.btn-blue');
            const originalText = btn.innerText;
            btn.innerText = '✅ Copiado!';
            setTimeout(() => btn.innerText = originalText, 2000);

            const lastSavedCto = localStorage.getItem('imais_last_saved_cto');
            const lastSavedPorts = localStorage.getItem('imais_last_saved_ports');
            
            if (currentCtoName === lastSavedCto && currentPortsJSON === lastSavedPorts) {
                await showCustomModal("⚠️ Nenhuma alteração detectada na CTO.\nO envio para a planilha foi cancelado para evitar duplicação.", false);
                return; 
            }
            
            if (typeof salvarEmBackground === 'function') {
                const confirma = await showCustomModal(`Deseja salvar/atualizar a ${currentCtoName} no Excel?`, true);
                
                if (confirma) {
                    salvarEmBackground();
                    localStorage.setItem('imais_last_saved_cto', currentCtoName);
                    localStorage.setItem('imais_last_saved_ports', currentPortsJSON);
                }
            }
        });
    }

            // --- MOTOR DA NOVA JANELA DE AVISOS ---
    function showCustomModal(mensagem, isConfirm = false) {
        return new Promise((resolve) => {
            const modal = document.getElementById('customModal');
            const modalText = document.getElementById('modalText');
            const btnOk = document.getElementById('modalBtnOk');
            const btnCancel = document.getElementById('modalBtnCancel');

            modalText.innerText = mensagem;
            btnCancel.style.display = isConfirm ? 'block' : 'none';
            
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);

            const closeModal = (resultado) => {
                modal.classList.remove('show');
                setTimeout(() => {
                    modal.style.display = 'none';
                    btnOk.onclick = null;
                    btnCancel.onclick = null;
                    resolve(resultado);
                }, 200);
            };

            btnOk.onclick = () => closeModal(true);
            btnCancel.onclick = () => closeModal(false);
        });
    }

    // --- NOVO BOTÃO LIMPAR USANDO O MODAL ---
    async function clearAll() {
        const querLimpar = await showCustomModal('Limpar toda a CTO?', true);
        
        if(querLimpar) {
            sfxLixo.play().catch(e => {}); 
            document.getElementById('ctoName').value = '';
            document.getElementById('textoRetorno').value = ''; 
            portsData.fill('');
            renderPorts();
            updatePreview();
            localStorage.removeItem('imais_cto');
            localStorage.removeItem('imais_ports');
            checkDuplicates(); 
        }
    }


    const totalPorts = 16;
    let portsData = new Array(totalPorts).fill('');

    document.addEventListener('DOMContentLoaded', () => {
        renderPorts();
        loadSavedData();
        checkConnection();
        loadTheme();
    });

    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        document.getElementById('themeToggle').innerText = isLight ? '🌙' : '☀️';
        localStorage.setItem('imais_theme', isLight ? 'light' : 'dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', isLight ? '#f0f2f5' : '#111827');
    }

    function loadTheme() {
        const savedTheme = localStorage.getItem('imais_theme');
        const themeBtn = document.getElementById('themeToggle');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            themeBtn.innerText = '🌙';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f0f2f5');
        } else {
            themeBtn.innerText = '☀️';
        }
    }

    function renderPorts() {
        const container = document.getElementById('portsContainer');
        let html = '';
        for (let i = 1; i <= totalPorts; i++) {
            html += `
            <div class="port-row">
                <span class="port-label">P${i}</span>
                <div class="port-input-wrapper">
                    <input type="text" id="input-${i}" oninput="updateData(${i}, this.value)" placeholder="PE">
                </div>
                <div class="action-buttons">
                    <button class="mini-btn" id="btn-u-${i}" onclick="setQuickAction(${i}, 'Sem ident.')">?</button>
                    <button class="mini-btn" id="btn-d-${i}" onclick="setQuickAction(${i}, 'Defeito')">!</button>
                    <button class="mini-btn" id="btn-e-${i}" onclick="setQuickAction(${i}, 'Livre')">∞</button>
                </div>
            </div>`;
        }
        container.innerHTML = html;
    }

    function updateData(index, value) {
        portsData[index - 1] = value;
        updatePreview();
        updateButtonStyles(index, value);
        saveData();
        checkDuplicates();
    }

    function checkDuplicates() {
        const ignoredValues = ['', 'Livre', 'Defeito', 'Sem ident.', 'Reserva', 'Vago'];
        const valueMap = {}; 
        let hasDuplicate = false;

        for (let i = 1; i <= totalPorts; i++) {
            const input = document.getElementById(`input-${i}`);
            if (input) input.classList.remove('input-error');
        }

        portsData.forEach((val, index) => {
            const cleanVal = val.trim();
            if (cleanVal && !ignoredValues.includes(cleanVal)) {
                if (!valueMap[cleanVal]) {
                    valueMap[cleanVal] = [];
                }
                valueMap[cleanVal].push(index + 1);
            }
        });

        Object.keys(valueMap).forEach(key => {
            const positions = valueMap[key];
            if (positions.length > 1) { 
                hasDuplicate = true;
                positions.forEach(portNum => {
                    const input = document.getElementById(`input-${portNum}`);
                    if (input) input.classList.add('input-error');
                });
            }
        });

        showToast(hasDuplicate);
    }

    function updateButtonStyles(index, value) {
        document.getElementById(`btn-u-${index}`).className = 'mini-btn' + (value === 'Sem ident.' ? ' active-warning' : '');
        document.getElementById(`btn-d-${index}`).className = 'mini-btn' + (value === 'Defeito' ? ' active-danger' : '');
        document.getElementById(`btn-e-${index}`).className = 'mini-btn' + (value === 'Livre' ? ' active-info' : '');
    }

        function updatePreview() {
        // 1. Atualiza o texto invisível para o botão de Copiar funcionar
        const cto = document.getElementById('ctoName').value || 'CTO SEM NOME';
        let text = `📌 *${cto}*\n\n`;
        
        // 2. Prepara a variável que vai segurar os quadradinhos
        let quadradosHtml = '';

        portsData.forEach((val, i) => {
            // Continua montando o texto para o Zap
            text += `P${i+1} ➔ ${val || '---'}\n`;

            // 3. Lógica das Cores
            let corFundo = 'var(--input-bg)'; // Cor de fundo padrão (Vazia)
            let corTexto = 'var(--text-main)'; // Cor do texto padrão
            
            if (val === 'Livre') {
                corFundo = '#4ade80'; // Verde
                corTexto = '#000000'; // Texto preto para dar contraste
            } else if (val === 'Defeito') {
                corFundo = '#dc2626'; // Vermelho
                corTexto = '#ffffff'; // Texto branco
            } else if (val === 'Sem ident.') {
                corFundo = '#f59e0b'; // Amarelo
                corTexto = '#000000'; // Texto preto
            } else if (val !== '') {
                // Se tiver qualquer outro texto (ex: nome do cliente, PPPOE), fica Azul
                corFundo = '#2563eb'; 
                corTexto = '#ffffff';
            }

            // 4. Desenha cada porta (quadradinho) com a cor decidida
            quadradosHtml += `
                <div id="quad-vis-${i + 1}" style="
                    background-color: ${corFundo}; 
                    color: ${corTexto};
                    border: 2px solid var(--border);
                    border-radius: 8px;
                    aspect-ratio: 1; 
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-weight: bold;
                    font-size: 1.2rem;
                    transition: background-color 0.4s ease;
                ">
                    ${i + 1}
                </div>
            `;
        });

        // Atualiza a área de texto escondida
        document.getElementById('previewArea').textContent = text; 
        
        // Joga os quadradinhos na nossa nova grade HTML!
        document.getElementById('ctoDrawing').innerHTML = quadradosHtml;
    }

    async function analisarRetorno() {
        const texto = document.getElementById('textoRetorno').value;
        
        updatePreview();
        
        if (!texto.trim()) {
            await showCustomModal("Cole a mensagem da central primeiro!", false);
            return;
        }

        const regex = /(?<!\d)\d{4,5}(?!\d)/g;
        const codigosInativos = texto.match(regex) || [];

        if (codigosInativos.length === 0) {
            await showCustomModal("Nenhum código de 4 ou 5 dígitos encontrado no texto.", false);
            return;
        }

        let encontrados = 0;

        for (let i = 0; i < 16; i++) {
            const valorNaPorta = portsData[i] ? portsData[i].trim() : '';
            
            if (valorNaPorta !== '' && codigosInativos.includes(valorNaPorta)) {
                const quadrado = document.getElementById(`quad-vis-${i + 1}`);
                if (quadrado) {
                    quadrado.classList.add('status-remover');
                    quadrado.innerHTML = '🗑️'; 
                    encontrados++;
                }
            }
        }

        if (encontrados > 0) {
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            sfxErro.currentTime = 0;
            sfxErro.play().catch(e => {}); 
            showToast(false); 
        } else {
            await showCustomModal(`Achei os códigos (${codigosInativos.join(', ')}), mas nenhum bate com o que você digitou nas portas.`, false);
        }
    }




    function saveData() {
        localStorage.setItem('imais_cto', document.getElementById('ctoName').value);
        localStorage.setItem('imais_ports', JSON.stringify(portsData));
    }

    function loadSavedData() {
        const cto = localStorage.getItem('imais_cto');
        const ports = JSON.parse(localStorage.getItem('imais_ports'));
        if(cto) document.getElementById('ctoName').value = cto;
        if(ports) {
            portsData = ports;
            ports.forEach((val, i) => {
                const input = document.getElementById(`input-${i+1}`);
                if(input) {
                    input.value = val;
                    updateButtonStyles(i+1, val);
                }
            });
            checkDuplicates(); 
        }
        updatePreview();
    }

    function checkConnection() {
        window.addEventListener('online', () => document.getElementById('onlineStatus').style.opacity = '1');
        window.addEventListener('offline', () => document.getElementById('onlineStatus').style.opacity = '0.3');
    }

    // Função para Expandir/Comprimir a área da Central
    function toggleCentral() {
        const area = document.getElementById('areaCentral');
        const btn = document.getElementById('btnToggleCentral');
        
        if (area.style.display === 'none') {
            area.style.display = 'block';
            btn.innerHTML = '⚙️ Ferramentas da Central (Fechar)';
        } else {
            area.style.display = 'none';
            btn.innerHTML = '⚙️ Ferramentas da Central (Abrir)';
        }
    }

    // Função de Engenharia Reversa (Puxa os dados do texto do Excel de volta para o App)
        async function carregarCTO() {
        const texto = document.getElementById('textoRetorno').value;
        
        if (!texto.trim()) {
            await showCustomModal("Cole o texto da CTO copiado da planilha primeiro!", false);
            return;
        }

        const regexCTO = /📌\s*\*(.*?)\*/;
        const matchCTO = texto.match(regexCTO);
        if (matchCTO && matchCTO[1]) {
            document.getElementById('ctoName').value = matchCTO[1].trim();
        }

        for (let i = 1; i <= 16; i++) {
            const regexPorta = new RegExp(`P${i}\\s*➔\\s*(.+)`);
            const matchPorta = texto.match(regexPorta);
            
            let valorDaPorta = '';
            if (matchPorta && matchPorta[1]) {
                valorDaPorta = matchPorta[1].trim();
                if (valorDaPorta === '---') valorDaPorta = ''; 
            }

            const input = document.getElementById(`input-${i}`);
            if (input) {
                input.value = valorDaPorta;
            }
            
            portsData[i - 1] = valorDaPorta;
            updateButtonStyles(i, valorDaPorta);
        }

        saveData();
        checkDuplicates();
        updatePreview();
        
        document.getElementById('textoRetorno').value = '';
        toggleCentral();
        
        if (typeof sfxSucesso !== 'undefined') {
            sfxSucesso.currentTime = 0;
            sfxSucesso.play().catch(e => {});
        }
    }


    async function buscarBancoDados() {
        const ctoNome = document.getElementById('ctoName').value.trim();
        
        if (!ctoNome) {
            await showCustomModal("Digite pelo menos um pedaço do nome da CTO (ex: 4.2.4) para buscar!", false);
            return;
        }

        const btnBusca = document.querySelector('button[onclick="buscarBancoDados()"]');
        const textoOriginal = btnBusca.innerHTML;
        btnBusca.innerHTML = '⏳';
        
        try {
            const urlDB = 'https://sheetdb.io/api/v1/uzfmxhzz8a28d';
            const resposta = await fetch(`${urlDB}/search?CTO=*${encodeURIComponent(ctoNome)}*&casesensitive=false`);
            const dados = await resposta.json();

            if (dados && dados.length > 0) {
                if (dados.length === 1) {
                    const resumoEncontrado = dados[0].RESUMO;
                    document.getElementById('textoRetorno').value = resumoEncontrado;
                    carregarCTO(); 
                } else {
                    const nomesEncontrados = dados.map(item => item.CTO).join('\n- ');
                    await showCustomModal(`Encontrei ${dados.length} caixas que contêm "${ctoNome}":\n\n- ${nomesEncontrados}\n\nPor favor, digite mais números/letras para eu saber qual é a certa.`, false);
                }
            } else {
                await showCustomModal(`Nenhuma caixa encontrada contendo "${ctoNome}".`, false);
            }
        } catch (erro) {
            console.error("Erro ao buscar:", erro);
            await showCustomModal("Erro ao conectar com o banco de dados. Verifique a internet.", false);
        } finally {
            btnBusca.innerHTML = textoOriginal;
        }
    }



    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    }
</script>
