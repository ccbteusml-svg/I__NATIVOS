<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>I__NATIVOS — Controle de CTO / Fibra</title>
    <meta name="theme-color" content="#f2f3f7">
    <style>
        :root {
            --bg: #f2f3f7;
            --card: #ffffff;
            --border: #e3e5ec;
            --text: #1a1a2e;
            --muted: #8a8fa3;
            --blue: #2f6bff;
            --blue-dark: #1e4fd6;
            --red: #e5484d;
            --green: #0e9f5d;
            --btn-gray: #eef0f5;
        }
        body.dark {
            --bg: #14151c;
            --card: #1e2029;
            --border: #2c2f3b;
            --text: #f2f3f7;
            --muted: #7d8296;
            --btn-gray: #2a2d38;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background .3s, color .3s;
        }
        .app { max-width: 520px; margin: 0 auto; padding: 24px 16px calc(40px + env(safe-area-inset-bottom)); }

        /* Header */
        header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; }
        .brand h1 { font-size: 2.1rem; font-weight: 900; color: var(--blue); letter-spacing: .02em; }
        .brand p { font-size: 1.05rem; color: var(--muted); font-weight: 600; margin-top: 2px; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .theme-btn {
            width: 52px; height: 52px; border-radius: 50%;
            border: 2px solid var(--border); background: var(--card);
            font-size: 1.4rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform .15s;
        }
        .theme-btn:active { transform: scale(.92); }
        .status-pill {
            display: flex; align-items: center; gap: 8px;
            background: var(--green); color: #fff;
            padding: 12px 20px; border-radius: 999px;
            font-size: 1rem; font-weight: 800;
        }
        .status-pill .dot { width: 12px; height: 12px; border-radius: 50%; background: #7dffb0; }

        /* Card */
        .card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 22px;
            padding: 22px 18px;
            margin-bottom: 18px;
            box-shadow: 0 4px 14px rgba(0,0,0,.06);
        }
        .card-title { font-size: 1.15rem; font-weight: 800; color: var(--muted); margin-bottom: 14px; }
        .cto-input {
            width: 100%;
            padding: 16px 58px 16px 16px;
            border: 2px solid var(--border);
            border-radius: 14px;
            background: var(--bg);
            color: var(--text);
            font-size: 1.15rem;
            font-weight: 600;
            outline: none;
            margin-bottom: 14px;
        }
        .cto-input:focus { border-color: var(--blue); }
        .cto-input::placeholder { color: var(--muted); font-weight: 500; }

        .input-wrap { position: relative; }
        .search-btn {
            position: absolute; right: 8px; top: 8px;
            width: 44px; height: 44px;
            border: none; border-radius: 10px;
            background: var(--blue); color: #fff;
            font-size: 1.15rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform .15s, filter .15s;
        }
        .search-btn:active { transform: scale(.92); filter: brightness(.9); }
        .search-btn:disabled { opacity: .6; }

        /* Autocomplete — aparece só enquanto digita */
        .suggest-list {
            position: absolute; top: calc(100% - 10px); left: 4px; right: 4px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
            z-index: 50; overflow: hidden;
            display: none;
        }
        .suggest-list.show { display: block; }
        .suggest-item {
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
            width: 100%; padding: 14px 16px;
            border: none; border-bottom: 2px solid var(--border);
            background: transparent; color: var(--text);
            font-size: 1rem; font-weight: 700; font-family: inherit;
            text-align: left; cursor: pointer;
        }
        .suggest-item:last-child { border-bottom: none; }
        .suggest-item:active { background: var(--btn-gray); }
        .suggest-item .suggest-ports {
            font-size: .75rem; font-weight: 800; color: var(--muted);
            background: var(--btn-gray); border-radius: 999px;
            padding: 4px 10px; flex-shrink: 0;
        }
        .suggest-empty {
            padding: 14px 16px; font-size: .95rem; font-weight: 600;
            color: var(--muted); text-align: center;
        }

        .btn-row { display: flex; gap: 12px; }
        .btn {
            flex: 1;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 16px;
            border: none; border-radius: 14px;
            font-size: 1.15rem; font-weight: 800;
            font-family: inherit; cursor: pointer;
            color: #fff;
            transition: transform .15s, filter .15s;
            min-height: 56px;
        }
        .btn:active { transform: scale(.97); filter: brightness(.92); }
        .btn-blue { background: var(--blue); }
        .btn-red { background: var(--red); flex: 0 0 72px; font-size: 1.4rem; padding: 16px 0; }

        /* Port rows */
        .port-row {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 4px;
            border-bottom: 2px solid var(--border);
        }
        .port-row:last-child { border-bottom: none; }
        .port-label { font-size: 1.15rem; font-weight: 900; color: var(--blue); flex: 0 0 42px; }
        .port-input {
            flex: 1; min-width: 0;
            padding: 13px 14px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--bg);
            color: var(--text);
            font-size: 1rem; font-weight: 600;
            outline: none;
        }
        .port-input:focus { border-color: var(--blue); }
        .port-btn {
            width: 52px; height: 52px; flex: 0 0 52px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--btn-gray);
            color: var(--text);
            font-size: 1.2rem; font-weight: 800;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform .15s;
        }
        .port-btn:active { transform: scale(.92); }
        .port-btn.active-warn { background: #ffaa00; color: #000; border-color: #ffaa00; }
        .port-btn.active-danger { background: var(--red); color: #fff; border-color: var(--red); }
        .port-btn.active-info { background: var(--blue); color: #fff; border-color: var(--blue); }

        /* Toast */
        .toast {
            position: fixed;
            bottom: calc(24px + env(safe-area-inset-bottom));
            left: 50%; transform: translateX(-50%) translateY(120px);
            background: var(--text); color: var(--bg);
            padding: 14px 22px; border-radius: 14px;
            font-size: .95rem; font-weight: 700;
            transition: transform .3s;
            z-index: 100; pointer-events: none;
            max-width: calc(100vw - 32px);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
<div class="app">
    <header>
        <div class="brand">
            <h1>I__NATIVOS</h1>
            <p>Controle de CTO / Fibra</p>
        </div>
        <div class="header-right">
            <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Alternar tema">🌙</button>
            <div class="status-pill"><span class="dot"></span>On</div>
        </div>
    </header>

    <div class="card">
        <div class="card-title">Identificação da CTO</div>
        <div class="input-wrap">
            <input type="text" id="ctoName" class="cto-input" placeholder="Ex: CTOMO 16.1.6" autocomplete="off"
                oninput="onCtoInput()" onfocus="onCtoInput()"
                onkeydown="if(event.key==='Enter')searchCTO()">
            <button class="search-btn" id="searchBtn" onclick="searchCTO()" aria-label="Buscar e preencher">🔍</button>
            <div class="suggest-list" id="suggestList"></div>
        </div>
        <div class="btn-row">
            <button class="btn btn-blue" onclick="copyAll()">📋 Copiar</button>
            <button class="btn btn-red" onclick="clearAll()" aria-label="Limpar tudo">🗑️</button>
        </div>
    </div>

    <div class="card">
        <div id="portsContainer"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const TOTAL_PORTS = 16;
    const KEY = 'inativos_simples';
    let portsData = new Array(TOTAL_PORTS).fill('');
    let dark = false;

    function load() {
        try {
            const d = JSON.parse(localStorage.getItem(KEY) || '{}');
            if (d.cto) document.getElementById('ctoName').value = d.cto;
            if (Array.isArray(d.ports)) portsData = d.ports.concat(new Array(TOTAL_PORTS).fill('')).slice(0, TOTAL_PORTS);
            if (d.dark) { dark = true; document.body.classList.add('dark'); document.getElementById('themeBtn').textContent = '☀️'; }
        } catch (e) {}
    }

    function save() {
        localStorage.setItem(KEY, JSON.stringify({
            cto: document.getElementById('ctoName').value,
            ports: portsData,
            dark: dark
        }));
    }

    function renderPorts() {
        const c = document.getElementById('portsContainer');
        let html = '';
        for (let i = 1; i <= TOTAL_PORTS; i++) {
            html += `
            <div class="port-row">
                <span class="port-label">P${i}</span>
                <input type="text" class="port-input" id="input-${i}" value="${portsData[i-1] || ''}"
                    placeholder="PE" autocapitalize="characters"
                    oninput="updateData(${i}, this.value)">
                <button class="port-btn ${portsData[i-1]==='Sem ident.'?'active-warn':''}" id="btn-u-${i}" onclick="quick(${i},'Sem ident.')">?</button>
                <button class="port-btn ${portsData[i-1]==='Defeito'?'active-danger':''}" id="btn-d-${i}" onclick="quick(${i},'Defeito')">!</button>
                <button class="port-btn ${portsData[i-1]==='Livre'?'active-info':''}" id="btn-e-${i}" onclick="quick(${i},'Livre')">∞</button>
            </div>`;
        }
        c.innerHTML = html;
    }

    function updateData(i, v) {
        portsData[i-1] = v;
        refreshButtons(i, v);
        save();
    }

    function quick(i, text) {
        const input = document.getElementById('input-' + i);
        input.value = (input.value === text) ? '' : text;
        portsData[i-1] = input.value;
        refreshButtons(i, input.value);
        save();
    }

    function refreshButtons(i, v) {
        document.getElementById('btn-u-' + i).className = 'port-btn' + (v === 'Sem ident.' ? ' active-warn' : '');
        document.getElementById('btn-d-' + i).className = 'port-btn' + (v === 'Defeito' ? ' active-danger' : '');
        document.getElementById('btn-e-' + i).className = 'port-btn' + (v === 'Livre' ? ' active-info' : '');
    }

    function buildText() {
        const cto = document.getElementById('ctoName').value.trim() || 'CTO SEM NOME';
        let t = cto + '\n\n';
        portsData.forEach((v, i) => { t += 'P' + (i+1) + ': ' + (v || '---') + '\n'; });
        return t;
    }

    async function copyAll() {
        try {
            await navigator.clipboard.writeText(buildText());
            showToast('✅ Copiado!');
        } catch (e) {
            const ta = document.createElement('textarea');
            ta.value = buildText();
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            showToast('✅ Copiado!');
        }
    }

    function clearAll() {
        if (!confirm('Limpar todos os dados?')) return;
        document.getElementById('ctoName').value = '';
        portsData.fill('');
        renderPorts();
        save();
        showToast('🗑️ Limpo!');
    }

    function toggleTheme() {
        dark = !dark;
        document.body.classList.toggle('dark', dark);
        document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙';
        save();
    }

    // ===== BUSCA INTELIGENTE COM AUTOCOMPLETE =====
    const SHEETDB_URL = 'https://sheetdb.io/api/v1/uzfmxhzz8a28d';
    let sheetCache = null;
    let sheetLoading = null;
    let suggestTimer = null;
    let suggestItems = [];

    // Pré-carrega a planilha assim que o usuário toca no campo (silencioso)
    function ensureSheetLoaded() {
        if (sheetCache) return Promise.resolve(sheetCache);
        if (!sheetLoading) {
            sheetLoading = fetch(SHEETDB_URL)
                .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(data => { sheetCache = data; return data; })
                .catch(e => { sheetLoading = null; throw e; });
        }
        return sheetLoading;
    }

    // Pontua o quão boa é a coincidência (maior = melhor)
    function scoreMatch(item, termoNorm) {
        const ctoNorm = normalizarCTO(item.CTO);
        if (!ctoNorm || !termoNorm) return -1;
        if (ctoNorm === termoNorm) return 100;
        const tNums = termoNorm.replace(/[^0-9.]/g, '');
        const cNums = ctoNorm.replace(/[^0-9.]/g, '');
        if (tNums && cNums === tNums) return 90;
        if (tNums && (cNums.startsWith(tNums) || tNums.startsWith(cNums))) return 70;
        if (ctoNorm.includes(termoNorm)) return 50;
        const tPrefixo = termoNorm.match(/^[A-Z]+/)?.[0] || '';
        if (tPrefixo && ctoNorm.startsWith(tPrefixo) && tNums && cNums.split('.')[0] === tNums.split('.')[0]) return 60;
        return -1;
    }

    function contarPortasPreenchidas(resumo) {
        let n = 0;
        for (const linha of (resumo || '').split('\n')) {
            const m = linha.match(/^\s*P\d{1,2}\s*(?:➔|:|-|–|\.)\s*(.+)$/i);
            if (m && m[1].trim() && m[1].trim() !== '---') n++;
        }
        return n;
    }

    function buscarSugestoes(termo) {
        const termoNorm = normalizarCTO(termo);
        if (!termoNorm || !sheetCache) return [];
        return sheetCache
            .map(item => ({ item, score: scoreMatch(item, termoNorm) }))
            .filter(x => x.score >= 0)
            .sort((a, b) => b.score - a.score || a.item.CTO.localeCompare(b.item.CTO))
            .slice(0, 6)
            .map(x => x.item);
    }

    function renderSuggest(list) {
        const box = document.getElementById('suggestList');
        if (!list.length) {
            box.innerHTML = '<div class="suggest-empty">Nenhuma CTO encontrada</div>';
        } else {
            box.innerHTML = list.map((item, i) => `
                <button class="suggest-item" onclick="pickSuggest(${i})">
                    <span>${item.CTO}</span>
                    <span class="suggest-ports">${contarPortasPreenchidas(item.RESUMO)} portas</span>
                </button>`).join('');
        }
        suggestItems = list;
        box.classList.add('show');
    }

    function hideSuggest() {
        document.getElementById('suggestList').classList.remove('show');
        suggestItems = [];
    }

    // Chamado a cada tecla digitada (com atraso de 250ms para não travar)
    function onCtoInput() {
        clearTimeout(suggestTimer);
        const termo = document.getElementById('ctoName').value.trim();
        if (termo.length < 2) { hideSuggest(); return; }
        suggestTimer = setTimeout(async () => {
            try {
                await ensureSheetLoaded();
                renderSuggest(buscarSugestoes(termo));
            } catch (e) { hideSuggest(); }
        }, 250);
        save();
    }

    function pickSuggest(i) {
        const item = suggestItems[i];
        if (!item) return;
        hideSuggest();
        document.getElementById('ctoName').value = item.CTO;
        applyResumo(item);
    }

    function applyResumo(item) {
        const novas = parseResumo(item.RESUMO);
        let preenchidas = 0;
        novas.forEach(v => { if (v && v !== '---') preenchidas++; });
        portsData = novas;
        renderPorts();
        save();
        showToast('✅ ' + item.CTO + ' preenchida (' + preenchidas + ' portas)');
    }

    // Lupa: preenche a melhor coincidência direto (atalho, sem lista)
    async function searchCTO() {
        const termo = document.getElementById('ctoName').value.trim();
        if (!termo) { showToast('Digite o nome da CTO primeiro'); return; }
        const btn = document.getElementById('searchBtn');
        btn.disabled = true;
        btn.textContent = '⏳';
        hideSuggest();
        try {
            await ensureSheetLoaded();
            const list = buscarSugestoes(termo);
            if (!list.length) {
                showToast('❌ CTO não encontrada na planilha');
            } else {
                applyResumo(list[0]);
                document.getElementById('ctoName').value = list[0].CTO;
                save();
            }
        } catch (e) {
            showToast('⚠️ Sem conexão com a planilha');
        } finally {
            btn.disabled = false;
            btn.textContent = '🔍';
        }
    }

    function normalizarCTO(nome) {
        if (!nome) return '';
        let s = nome.toUpperCase().trim();
        s = s.replace(/\bCTO\b\s*/g, '').trim();
        if (s.startsWith('CTO') && s.length > 3) s = s.slice(3);
        const m = s.match(/^[A-Z]+/);
        const prefixo = m ? m[0] : '';
        let resto = prefixo ? s.slice(prefixo.length) : s;
        resto = resto.replace(/^[^A-Z0-9]+/i, '').replace(/-/g, '.');
        const nums = (resto.match(/\d+/g) || []).join('.');
        return prefixo ? prefixo + ' ' + nums : nums;
    }

    function parseResumo(resumo) {
        // Aceita linhas como "P1 ➔ valor" ou "P1: valor" ou "P1 - valor"
        const result = new Array(TOTAL_PORTS).fill('');
        const linhas = (resumo || '').split('\n');
        for (const linha of linhas) {
            const m = linha.match(/^\s*P(\d{1,2})\s*(?:➔|:|-|–|\.)\s*(.*)$/i);
            if (!m) continue;
            const n = parseInt(m[1], 10);
            if (n >= 1 && n <= TOTAL_PORTS) result[n - 1] = m[2].trim();
        }
        return result;
    }

    async function searchCTO() {
        const termo = document.getElementById('ctoName').value.trim();
        if (!termo) { showToast('Digite o nome da CTO primeiro'); return; }
        const btn = document.getElementById('searchBtn');
        btn.disabled = true;
        btn.textContent = '⏳';
        hideSuggest();
        try {
            await ensureSheetLoaded();
            const list = buscarSugestoes(termo);
            if (!list.length) {
                showToast('❌ CTO não encontrada na planilha');
            } else {
                applyResumo(list[0]);
                document.getElementById('ctoName').value = list[0].CTO;
                save();
            }
        } catch (e) {
            showToast('⚠️ Sem conexão com a planilha');
        } finally {
            btn.disabled = false;
            btn.textContent = '🔍';
        }
    }

    let toastTimer;
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    load();
    renderPorts();

    // Pré-carrega a planilha em silêncio e fecha a lista ao tocar fora
    ensureSheetLoaded().catch(() => {});
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.input-wrap')) hideSuggest();
    });
</script>
</body>
</html>
