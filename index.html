<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I__NATIVOS Gerenciador</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/751/751463.png">

    <style>
        :root {
            /* Cores padrão (Modo Escuro) */
            --primary: #2563eb;
            --danger: #dc2626;
            --warning: #f59e0b;
            --dark-bg: #111827; 
            --card-bg: #1f2937;
            --text-main: #f3f4f6;
            --border: #374151;
            --input-bg: #374151;
            --input-text: #ffffff;
            --btn-mini-bg: #4b5563;
            --btn-mini-text: #ffffff;
        }

        /* Sobrescrita para Modo Claro (Dia) */
        body.light-mode {
            --dark-bg: #f0f2f5;      /* Fundo cinza bem claro */
            --card-bg: #ffffff;      /* Cartões brancos */
            --text-main: #1f2937;    /* Texto escuro */
            --border: #d1d5db;       /* Bordas cinza claro */
            --input-bg: #f9fafb;     /* Input claro */
            --input-text: #111827;   /* Texto do input preto */
            --btn-mini-bg: #e5e7eb;  /* Botões mini mais claros */
            --btn-mini-text: #374151;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--dark-bg);
            margin: 0;
            padding: 10px;
            color: var(--text-main);
            padding-bottom: 80px; 
            transition: background-color 0.3s, color 0.3s; /* Transição suave */
        }

        .container { max-width: 600px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            background-color: #064e3b;
            color: #4ade80;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; }

        /* Botão de Tema */
        .theme-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 16px;
            border: 1px solid var(--border);
            transition: background-color 0.3s, border-color 0.3s;
        }

        label { display: block; font-weight: 600; margin-bottom: 8px; color: #9ca3af; }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--input-bg);
            color: var(--input-text);
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.7; }
        .btn-blue { background-color: var(--primary); }
        .btn-red { background-color: var(--danger); }

        .port-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .port-label { font-weight: bold; color: var(--primary); width: 40px; }
        .port-input-wrapper { flex: 1; }

        .action-buttons { display: flex; gap: 5px; }

        .mini-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            background: var(--btn-mini-bg);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--btn-mini-text);
            font-size: 1.2rem;
            transition: background-color 0.3s;
        }

        /* Cores fixas para os botões de status ativos (não mudam com o tema) */
        .active-warning { background-color: var(--warning) !important; color: #fff !important; }
        .active-danger { background-color: var(--danger) !important; color: #fff !important; }
        .active-info { background-color: #6b7280 !important; color: #fff !important; }

        .preview-box {
            /* Mantemos o terminal sempre escuro para contraste, estilo "Matrix" */
            background-color: #0f172a;
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            color: #60a5fa;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 style="margin:0; font-size:1.4rem; color:var(--primary);">I__NATIVOS</h1>
            <small style="color:#9ca3af;">Controle de CTO / Fibra</small>
        </div>
        <div class="header-controls">
            <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">☀️</button>
            <div class="status-badge" id="onlineStatus">
                <div class="status-dot"></div> On
            </div>
        </div>
    </header>

    <div class="card">
        <label>Identificação da CTO</label>
        <input type="text" id="ctoName" placeholder="Ex: CTOMO 16.1.6" autocomplete="off">
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn btn-blue" style="flex: 2;" onclick="copyToWhatsapp()">📋 Copiar</button>
            <button class="btn btn-red" style="flex: 1;" onclick="clearAll()">🗑️</button>
        </div>
    </div>

    <div class="card" id="portsContainer">
        </div>

    <div class="card">
        <label>Prévia para Envio</label>
        <div class="preview-box" id="previewArea">Aguardando dados...</div>
    </div>
</div>

<script>
    const totalPorts = 16;
    let portsData = new Array(totalPorts).fill('');

    document.addEventListener('DOMContentLoaded', () => {
        renderPorts();
        loadSavedData();
        checkConnection();
        loadTheme(); // Carrega o tema salvo
    });

    // --- LÓGICA DO TEMA ---
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        
        // Atualiza ícone e salva
        document.getElementById('themeToggle').innerText = isLight ? '🌙' : '☀️';
        localStorage.setItem('imais_theme', isLight ? 'light' : 'dark');
        
        // Atualiza cor da barra de status do navegador (mobile)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', isLight ? '#f0f2f5' : '#111827');
    }

    function loadTheme() {
        const savedTheme = localStorage.getItem('imais_theme');
        const themeBtn = document.getElementById('themeToggle');
        
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            themeBtn.innerText = '🌙';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f0f2f5');
        } else {
            themeBtn.innerText = '☀️';
        }
    }
    // ----------------------

    function renderPorts() {
        const container = document.getElementById('portsContainer');
        let html = '';
        for (let i = 1; i <= totalPorts; i++) {
            html += `
            <div class="port-row">
                <span class="port-label">P${i}</span>
                <div class="port-input-wrapper">
                    <input type="text" id="input-${i}" oninput="updateData(${i}, this.value)" placeholder="PE">
                </div>
                <div class="action-buttons">
                    <button class="mini-btn" id="btn-u-${i}" onclick="setQuickAction(${i}, 'Sem ident.')">?</button>
                    <button class="mini-btn" id="btn-d-${i}" onclick="setQuickAction(${i}, 'Defeito')">!</button>
                    <button class="mini-btn" id="btn-e-${i}" onclick="setQuickAction(${i}, 'Livre')">∞</button>
                </div>
            </div>`;
        }
        container.innerHTML = html;
    }

    function updateData(index, value) {
        portsData[index - 1] = value;
        updatePreview();
        updateButtonStyles(index, value);
        saveData();
    }

    function setQuickAction(index, text) {
        const input = document.getElementById(`input-${index}`);
        input.value = text;
        updateData(index, text);
    }

    function updateButtonStyles(index, value) {
        document.getElementById(`btn-u-${index}`).className = 'mini-btn' + (value === 'Sem ident.' ? ' active-warning' : '');
        document.getElementById(`btn-d-${index}`).className = 'mini-btn' + (value === 'Defeito' ? ' active-danger' : '');
        document.getElementById(`btn-e-${index}`).className = 'mini-btn' + (value === 'Livre' ? ' active-info' : '');
    }

    function updatePreview() {
        const cto = document.getElementById('ctoName').value || 'CTO SEM NOME';
        let text = `📌 *${cto}*\n\n`;
        portsData.forEach((val, i) => {
            text += `P${i+1} ➔ ${val || '---'}\n`;
        });
        document.getElementById('previewArea').innerText = text;
    }

    function copyToWhatsapp() {
        const text = document.getElementById('previewArea').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('.btn-blue');
            const originalText = btn.innerText;
            btn.innerText = '✅ Copiado!';
            setTimeout(() => btn.innerText = originalText, 2000); // Restaura o texto original corretamente
        });
    }

    function clearAll() {
        if(confirm('Limpar toda a CTO?')) {
            document.getElementById('ctoName').value = '';
            portsData.fill('');
            renderPorts();
            updatePreview();
            // Não limpamos o localStorage inteiro para não perder a configuração do tema
            localStorage.removeItem('imais_cto');
            localStorage.removeItem('imais_ports');
        }
    }

    function saveData() {
        localStorage.setItem('imais_cto', document.getElementById('ctoName').value);
        localStorage.setItem('imais_ports', JSON.stringify(portsData));
    }

    function loadSavedData() {
        const cto = localStorage.getItem('imais_cto');
        const ports = JSON.parse(localStorage.getItem('imais_ports'));
        if(cto) document.getElementById('ctoName').value = cto;
        if(ports) {
            portsData = ports;
            ports.forEach((val, i) => {
                const input = document.getElementById(`input-${i+1}`);
                if(input) {
                    input.value = val;
                    updateButtonStyles(i+1, val);
                }
            });
        }
        updatePreview();
    }

    function checkConnection() {
        window.addEventListener('online', () => document.getElementById('onlineStatus').style.opacity = '1');
        window.addEventListener('offline', () => document.getElementById('onlineStatus').style.opacity = '0.3');
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    }
</script>
</body>
</html>
